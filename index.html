<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Analýza požárního útoku</title>
  <script src="https://cdn.jsdelivr.net/npm/webm-duration-fix@1.0.4/library.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111827;
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 8px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app-header {
      width: 100%;
      max-width: 1200px;
      margin-bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    h1 { font-size: 15px; font-weight: 700; color: #fff; }

    .header-actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      width: 100%;
    }

    .header-actions button,
    .header-actions select,
    .header-actions .file-input-btn {
      width: 100%;
      height: 32px;
      padding: 0 2px;
      border-radius: 5px;
      font-weight: 600;
      font-size: 10.5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 1px solid #4b5563;
      background: #374151;
      color: #fff;
      outline: none;
      text-align: center;
      white-space: nowrap;
    }

    .btn-settings { background: #4b5563 !important; }
    .btn-export { background: #ea580c !important; border-color: #c2410c !important; }
    .file-input-btn { background: #10b981 !important; border-color: #059669 !important; }

    .workspace {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    @media (min-width: 900px) {
      .app-header { flex-direction: row; justify-content: space-between; }
      .header-actions { display: flex; width: auto; }
      .header-actions button, .header-actions select, .header-actions .file-input-btn { width: auto; padding: 0 10px; font-size: 11px; }
      
      .workspace.portrait-mode {
        max-width: 1200px;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 20px;
      }
      .workspace.portrait-mode .left-stage {
        width: fit-content;
        max-width: 100%;
      }
      .workspace.portrait-mode .right-stage {
        flex: 1;
        max-width: 580px;
      }
      .workspace.portrait-mode video {
        max-height: calc(100vh - 120px);
        width: auto;
      }
    }

    .left-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: fit-content;
      max-width: 100%;
    }

    .right-stage {
      width: 100%;
    }

    .video-toolbar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      background: #1f2937;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
    }

    @media (max-width: 600px) {
      .video-toolbar { display: none; }
    }

    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-zoom {
      background: #374151;
      padding: 2px 6px;
      font-size: 10px;
      border-radius: 4px;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    .btn-zoom.active {
      background: #2563eb;
      color: #fff;
    }

    .video-wrapper {
      position: relative;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      cursor: default;
      display: inline-block;
      width: fit-content;
      max-width: 100%;
      line-height: 0;
      touch-action: none;
    }

    .video-wrapper.is-zoomed { cursor: grab; }
    .video-wrapper.is-zoomed:active { cursor: grabbing; }

    video {
      display: block;
      max-width: 100%;
      height: auto;
      max-height: 56vh;
      transform-origin: 0 0;
      user-select: none;
      pointer-events: none;
    }

    .hud-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      padding: 10px 8px;
      line-height: normal;
    }

    .split-times {
      display: flex;
      flex-direction: column-reverse;
      align-items: flex-end;
      gap: 3px;
      margin-bottom: 4px;
    }

    .split-row {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      background: rgba(0, 0, 0, 0.40);
      backdrop-filter: blur(3px);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      opacity: 0.30;
      transform: translateX(0);
      transition: opacity 0.2s ease, transform 0.2s ease, order 0.1s ease;
    }

    .split-row.active {
      opacity: 1;
      transform: scale(1.02);
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(0, 0, 0, 0.55);
    }

    .split-label {
      font-size: 10px;
      color: #e5e7eb;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1.1;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }

    .split-val {
      font-size: 16px;
      color: #ffffff;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      text-shadow: 0 2px 4px rgba(0,0,0,0.95);
    }

    .main-timer-box {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      padding: 3px 10px;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }

    #main-timer {
      font-size: 22px;
      font-weight: 900;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }

    #prostrík-tag {
      font-size: 10px;
      font-weight: 700;
      color: #fbbf24;
      display: none;
      margin-top: 1px;
      line-height: 1;
    }

    @media (max-width: 600px) {
      .hud-overlay { padding: 4px 6px; }
      .split-times { gap: 2px; margin-bottom: 3px; }
      .split-row { padding: 1px 4px; border-radius: 3px; }
      .split-label { font-size: 8px; }
      .split-val { font-size: 12px; }
      .main-timer-box { padding: 2px 6px; }
      #main-timer { font-size: 17px; }
      #prostrík-tag { font-size: 8.5px; }
    }

    .controls-panel {
      width: 100%;
      background: #1f2937;
      padding: 10px 12px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    }

    .timeline-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: #ef4444;
      height: 16px;
      background: #374151;
      border-radius: 8px;
      cursor: pointer;
      touch-action: pan-x;
    }
    input[type="range"]::-webkit-slider-thumb {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #ef4444;
      cursor: pointer;
    }

    .waveform-container {
      display: none;
      flex-direction: column;
      gap: 6px;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 8px;
      border-radius: 8px;
      position: relative;
    }

    .waveform-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #94a3b8;
    }

    .waveform-canvas-wrapper {
      position: relative;
      width: 100%;
      height: 60px;
      background: #090d16;
      border-radius: 4px;
      cursor: crosshair;
      overflow: hidden; /* Zajišťuje fixaci, aby nic nepatřičného nepřetékalo */
    }

    #waveformCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .waveform-playhead {
      position: absolute;
      top: 0; bottom: 0;
      width: 2px;
      background: #ef4444;
      pointer-events: none;
      left: 0;
    }

    .waveform-start-marker {
      position: absolute;
      top: 0; bottom: 0;
      width: 2px;
      background: #10b981;
      pointer-events: none;
      display: none;
    }

    .waveform-start-marker::after {
      content: 'START';
      position: absolute;
      top: 2px;
      left: 3px;
      font-size: 8px;
      font-weight: 800;
      color: #10b981;
      background: rgba(0,0,0,0.7);
      padding: 1px 2px;
      border-radius: 2px;
    }

    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
      width: 100%;
      flex-wrap: nowrap;
    }

    .milestone-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
    }

    .divider {
      width: 1px;
      height: 24px;
      background: #4b5563;
      margin: 0 2px;
      flex-shrink: 0;
    }

    button {
      background: #374151;
      color: #fff;
      border: none;
      padding: 8px 4px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 11px;
      transition: background 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      gap: 3px;
      min-height: 36px;
    }

    button:active { transform: scale(0.97); }

    .btn-play { 
      background: #ef4444; 
      flex: 1.3;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 6px;
    }

    .btn-step-jump { background: #374151; flex: 1.1; font-size: 10.5px; }
    .btn-step-frame { background: #374151; flex: 1.1; font-size: 10.5px; }

    @media (max-width: 600px) {
      .btn-step-fine { display: none !important; }
      .desktop-audio-row { display: none !important; }
      
      .milestone-row button {
        padding: 8px 6px;
        font-size: 11px;
        min-height: 36px;
      }
    }

    .btn-start-point { 
      background: #d97706; 
      flex: 1.5;
      font-size: 11.5px;
    }
    .btn-audio { background: #7c3aed; }
    .btn-shot { background: #4f46e5; }

    .btn-milestone { background: #2563eb; }
    .btn-target { background: #059669; }
    .btn-reset { background: #4b5563; }

    .file-input-wrapper { display: inline-block; width: 100%; }
    .file-input-wrapper input { display: none; }

    #export-overlay, #settings-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
      padding: 16px;
    }

    .progress-box, .settings-modal {
      width: 100%;
      max-width: 400px;
      background: #1f2937;
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #374151;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #374151;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: #ea580c;
      transition: width 0.1s;
    }

    .settings-modal h2 { font-size: 15px; font-weight: 700; color: #fff; }
    .settings-subtext { font-size: 11px; color: #9ca3af; margin-top: -6px; text-align: center; }

    .settings-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 260px;
      overflow-y: auto;
    }

    .settings-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #111827;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #374151;
    }

    .drag-handle { color: #9ca3af; font-size: 16px; cursor: grab; padding: 0 4px; }
    .settings-item input[type="text"] {
      flex: 1;
      background: transparent;
      border: 1px solid transparent;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      outline: none;
    }
    .btn-item-del { background: transparent; color: #ef4444; padding: 4px; font-size: 14px; min-height: auto; }

    .new-item-row { width: 100%; display: flex; gap: 6px; }
    .new-item-row input {
      flex: 1;
      background: #111827;
      border: 1px solid #4b5563;
      border-radius: 6px;
      padding: 6px 8px;
      color: #fff;
      font-size: 12px;
      outline: none;
    }

    .settings-actions {
      width: 100%;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="app-header">
    <div class="header-top">
      <h1>Analýza útoku</h1>
    </div>
    <div class="header-actions">
      <button class="btn-settings" onclick="openSettings()">⚙️ Body</button>
      <select id="exportFpsSelect" class="fps-select" title="FPS exportu">
        <option value="60">60 FPS</option>
        <option value="30">30 FPS</option>
      </select>
      <button id="btnExport" class="btn-export" onclick="exportovatVideo()">💾 Export</button>
      <div class="file-input-wrapper">
        <label class="file-input-btn" for="videoFile">📁 Video</label>
        <input type="file" id="videoFile" accept="video/*">
      </div>
    </div>
  </div>

  <div class="workspace" id="workspace">
    <div class="left-stage">
      <div class="video-toolbar">
        <span style="color:#9ca3af; font-size:11px;">🔍 <b>Lupa:</b> Zvětšete a posuňte</span>
        <div class="zoom-controls">
          <button class="btn-zoom active" id="btnZoom1" onclick="setVideoZoom(1)">1×</button>
          <button class="btn-zoom" id="btnZoom2" onclick="setVideoZoom(2)">2×</button>
          <button class="btn-zoom" id="btnZoom3" onclick="setVideoZoom(3)">3×</button>
          <button class="btn-zoom" id="btnZoom4" onclick="setVideoZoom(4)">4×</button>
          <button class="btn-zoom" style="background:#4b5563; margin-left:4px;" onclick="resetVideoPan()">Reset</button>
        </div>
      </div>

      <div class="video-wrapper" id="videoWrapper">
        <video id="player" playsinline webkit-playsinline></video>
        <div class="hud-overlay">
          <div class="split-times" id="hudSplitTimes"></div>
          <div class="main-timer-box">
            <span id="main-timer">00:00</span>
            <span id="prostrík-tag"></span>
          </div>
        </div>
      </div>
    </div>

    <div class="right-stage">
      <div class="controls-panel">
        <div class="timeline-row">
          <input type="range" id="scrubber" min="0" max="100" step="0.0001" value="0">
        </div>

        <div class="waveform-container desktop-audio-row" id="waveformContainer">
          <div class="waveform-header">
            <span>📊 Audio vlna</span>
            <span id="waveformTimeLabel" style="font-size:10px; min-width:45px; text-align:right;">0.00 s</span>
          </div>
          <div class="waveform-canvas-wrapper" id="waveformWrapper">
            <canvas id="waveformCanvas"></canvas>
            <div class="waveform-playhead" id="waveformPlayhead"></div>
            <div class="waveform-start-marker" id="waveformStartMarker"></div>
          </div>
        </div>

        <div class="control-row">
          <button class="btn-step-jump" onclick="step(-0.5)">⏪ 0.5s</button>
          <button class="btn-step-frame" onclick="step(-1/30)">◀ 1 sn.</button>
          <button class="btn-step-fine desktop-audio-row" onclick="step(-1/60)">◂ Mikro</button>
          
          <div class="divider"></div>
          <button id="btnPlayPause" class="btn-play">Přehrát</button>
          <div class="divider"></div>

          <button class="btn-step-fine desktop-audio-row" onclick="step(1/60)">Mikro ▸</button>
          <button class="btn-step-frame" onclick="step(1/30)">1 sn. ▶</button>
          <button class="btn-step-jump" onclick="step(0.5)">0.5s ⏩</button>
        </div>

        <div class="control-row desktop-audio-row" style="justify-content: center; gap: 8px;">
          <button class="btn-audio" onclick="toggleWaveform()">📊 Audio vlna</button>
          <button class="btn-shot" id="btnDetectShot" onclick="detekovatVystrel()">⚡ Výstřel</button>
          <button class="btn-start-point" onclick="setZeroPoint()">🎯 START</button>
        </div>

        <div class="control-row" style="display: none;" id="mobileStartRow">
          <button class="btn-start-point" style="width: 100%; padding: 8px; font-size: 11.5px;" onclick="setZeroPoint()">🎯 Nastavit START (0,00)</button>
        </div>

        <div class="milestone-row" id="milestoneButtonsContainer"></div>
      </div>
    </div>
  </div>

  <canvas id="exportCanvas" style="display:none;"></canvas>

  <div id="export-overlay">
    <div class="progress-box">
      <h3 id="exportModalTitle" style="font-size:14px;">Vypaluji video...</h3>
      <div class="progress-bar-bg">
        <div id="exportProgress" class="progress-bar-fill"></div>
      </div>
      <span id="exportText" style="font-size:11px; color:#9ca3af;">Připravuji...</span>
    </div>
  </div>

  <div id="settings-overlay">
    <div class="settings-modal">
      <h2>Nastavení měřených bodů</h2>
      <span class="settings-subtext">Pořadí můžete měnit přetažením</span>
      <div class="settings-list" id="settingsList"></div>

      <div class="new-item-row">
        <input type="text" id="newMilestoneInput" placeholder="Název bodu...">
        <button class="btn-milestone" onclick="addNewMilestone()">+ Přidat</button>
      </div>

      <div class="settings-actions">
        <button class="btn-reset" onclick="resetToDefaultMilestones()">Výchozí</button>
        <button class="btn-target" onclick="closeSettings()">Hotovo</button>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('player');
    const videoWrapper = document.getElementById('videoWrapper');
    const workspace = document.getElementById('workspace');
    const scrubber = document.getElementById('scrubber');
    const mainTimer = document.getElementById('main-timer');
    const prostríkTag = document.getElementById('prostrík-tag');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const videoFileInput = document.getElementById('videoFile');
    const exportFpsSelect = document.getElementById('exportFpsSelect');

    const exportCanvas = document.getElementById('exportCanvas');
    const exportOverlay = document.getElementById('export-overlay');
    const exportProgress = document.getElementById('exportProgress');
    const exportText = document.getElementById('exportText');
    const exportModalTitle = document.getElementById('exportModalTitle');

    const settingsOverlay = document.getElementById('settings-overlay');
    const settingsList = document.getElementById('settingsList');
    const newMilestoneInput = document.getElementById('newMilestoneInput');
    const hudSplitTimes = document.getElementById('hudSplitTimes');
    const milestoneButtonsContainer = document.getElementById('milestoneButtonsContainer');

    const waveformContainer = document.getElementById('waveformContainer');
    const waveformWrapper = document.getElementById('waveformWrapper');
    const waveformCanvas = document.getElementById('waveformCanvas');
    const waveformPlayhead = document.getElementById('waveformPlayhead');
    const waveformStartMarker = document.getElementById('waveformStartMarker');
    const waveformTimeLabel = document.getElementById('waveformTimeLabel');
    const mobileStartRow = document.getElementById('mobileStartRow');

    if (window.innerWidth <= 600) {
      mobileStartRow.style.display = 'flex';
    }

    let startTime = 0;
    let isScrubbing = false;
    let originalFile = null;
    let isExporting = false;

    let globalAudioCtx = null;
    let videoMediaSourceNode = null;

    async function ensureAudioContextReady() {
      if (!globalAudioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        globalAudioCtx = new AudioCtx();
      }
      if (globalAudioCtx.state === 'suspended') {
        try { await globalAudioCtx.resume(); } catch (e) {}
      }
      return globalAudioCtx;
    }

    function initVideoAudioRouting() {
      if (!globalAudioCtx) return;
      if (!videoMediaSourceNode) {
        try {
          videoMediaSourceNode = globalAudioCtx.createMediaElementSource(video);
          videoMediaSourceNode.connect(globalAudioCtx.destination);
        } catch (e) {}
      }
    }

    let videoZoomLevel = 1;
    let videoPanX = 0;
    let videoPanY = 0;
    let isPanningVideo = false;
    let panStartX = 0;
    let panStartY = 0;

    let initialPinchDist = null;
    let initialZoomOnPinch = 1;
    let lastTapTime = 0;

    function applyVideoTransform() {
      videoZoomLevel = Math.max(1, Math.min(5, videoZoomLevel));

      if (videoZoomLevel === 1) {
        video.style.transform = 'none';
        videoWrapper.classList.remove('is-zoomed');
        videoPanX = 0;
        videoPanY = 0;
      } else {
        videoWrapper.classList.add('is-zoomed');
        const maxPanX = (videoWrapper.clientWidth * (videoZoomLevel - 1));
        const maxPanY = (videoWrapper.clientHeight * (videoZoomLevel - 1));
        videoPanX = Math.max(-maxPanX, Math.min(0, videoPanX));
        videoPanY = Math.max(-maxPanY, Math.min(0, videoPanY));
        video.style.transform = `translate(${videoPanX}px, ${videoPanY}px) scale(${videoZoomLevel})`;
      }

      document.querySelectorAll('.btn-zoom').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`btnZoom${Math.round(videoZoomLevel)}`);
      if (activeBtn) activeBtn.classList.add('active');
    }

    function setVideoZoom(level) {
      videoZoomLevel = level;
      if (level === 1) {
        videoPanX = 0;
        videoPanY = 0;
      } else {
        videoPanX = -(videoWrapper.clientWidth * (level - 1)) / 2;
        videoPanY = -(videoWrapper.clientHeight * (level - 1)) / 2;
      }
      applyVideoTransform();
    }

    function resetVideoPan() { setVideoZoom(1); }

    function getPinchDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    videoWrapper.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        const now = Date.now();
        if (now - lastTapTime < 300) {
          if (videoZoomLevel > 1) resetVideoPan();
          else setVideoZoom(2.5);
          lastTapTime = 0;
          return;
        }
        lastTapTime = now;
      }

      if (e.touches.length === 2) {
        isPanningVideo = false;
        initialPinchDist = getPinchDistance(e.touches);
        initialZoomOnPinch = videoZoomLevel;
      } else if (e.touches.length === 1 && videoZoomLevel > 1) {
        isPanningVideo = true;
        panStartX = e.touches[0].clientX - videoPanX;
        panStartY = e.touches[0].clientY - videoPanY;
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialPinchDist) {
        const currentDist = getPinchDistance(e.touches);
        const factor = currentDist / initialPinchDist;
        videoZoomLevel = initialZoomOnPinch * factor;
        applyVideoTransform();
      } else if (isPanningVideo && e.touches.length === 1) {
        videoPanX = e.touches[0].clientX - panStartX;
        videoPanY = e.touches[0].clientY - panStartY;
        applyVideoTransform();
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) initialPinchDist = null;
      if (e.touches.length === 0) isPanningVideo = false;
    });

    videoWrapper.addEventListener('mousedown', (e) => {
      if (videoZoomLevel > 1) {
        isPanningVideo = true;
        panStartX = e.clientX - videoPanX;
        panStartY = e.clientY - videoPanY;
      }
    });
    window.addEventListener('mousemove', (e) => {
      if (!isPanningVideo) return;
      videoPanX = e.clientX - panStartX;
      videoPanY = e.clientY - panStartY;
      applyVideoTransform();
    });

    let audioBufferData = null;

    async function loadAudioDataSafe() {
      if (audioBufferData) return audioBufferData;
      if (!originalFile) return null;

      const ctx = await ensureAudioContextReady();

      try {

        audioBufferData = await new Promise((resolve, reject) => {

      } catch (err) {

      }
    }

    function drawWaveform() {
      if (!audioBufferData || !video.duration) return;

      const canvas = waveformCanvas;
      const rect = waveformWrapper.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;

      const ctx = canvas.getContext('2d');
      const channel = audioBufferData.getChannelData(0);
      const sampleRate = audioBufferData.sampleRate;

      const totalDuration = video.duration;
      const startSample = 0;
      const endSample = channel.length;
      const totalSamples = Math.max(1, endSample - startSample);
      const step = Math.max(1, Math.floor(totalSamples / canvas.width));
      const amp = canvas.height / 2;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, amp);
      ctx.lineTo(canvas.width, amp);
      ctx.stroke();

      ctx.fillStyle = '#38bdf8';

      for (let i = 0; i < canvas.width; i++) {
        let min = 1.0;
        let max = -1.0;
        const currentIdx = startSample + (i * step);

        for (let j = 0; j < step; j++) {
          const sIdx = currentIdx + j;
          if (sIdx < channel.length) {
            const datum = channel[sIdx];
            if (datum < min) min = datum;
            if (datum > max) max = datum;
          }
        }

        if (max >= min) {
          const y1 = Math.max(0, (1 + min) * amp);
          const y2 = Math.min(canvas.height, (1 + max) * amp);
          ctx.fillRect(i, y1, 1, Math.max(1, y2 - y1));
        }
      }

      updateWaveformPlayhead();
    }

      video.currentTime = Math.max(0, Math.min(video.duration, clickedTime));
      scrubber.value = video.currentTime;

    function formatTimerDisplay(seconds) {
      const totalHundredths = Math.round(seconds * 100);
      const totalSeconds = Math.floor(totalHundredths / 100);
      const ms = totalHundredths % 100;
      const sec = totalSeconds % 60;
      const min = Math.floor(totalSeconds / 60);

      const msStr = ms.toString().padStart(2, '0');
      const secStr = sec.toString().padStart(2, '0');

      if (min > 0) return `${min}:${secStr}:${msStr}`;
      return `${secStr}:${msStr}`;
    }

      if (finalniCasUtoku !== null && relTime >= finalniCasUtoku) {

        const pomalejsi = milestonesData.terc_l > milestonesData.terc_p ? 'Prostřik LP' : 'Prostřik PP';

      const sortedMilestones = [...activeMilestonesConfig].sort((a, b) => {

        const valB = milestonesData[b.id] !== null ? milestonesData[b.id] : 999999;
        return valA - valB;
      });

      sortedMilestones.forEach((m, idx) => {

            row.classList.remove('active');
          }
        }
      }
    }

    async function detekovatVystrel() {
      if (!originalFile) {
        alert("Nejprve vyberte soubor s videem.");
        return;
      }

      const btn = document.getElementById('btnDetectShot');
      const origText = btn.textContent;
      btn.textContent = "⏳ Hledám...";

      try {
        const buf = await loadAudioDataSafe();
        if (!buf) {
          alert("Nelze detekovat výstřel – zvuková stopa není dostupná.");
          btn.textContent = origText;
          return;
        }

        const channelData = buf.getChannelData(0);
        const sampleRate = buf.sampleRate;
        const maxScanSamples = Math.min(channelData.length, sampleRate * 30);

        let sumEnergy = 0;
        const initialWindow = Math.min(sampleRate * 2, maxScanSamples);
        for (let i = 0; i < initialWindow; i++) {
          sumEnergy += Math.abs(channelData[i]);
        }
        const avgNoise = sumEnergy / initialWindow;
        const threshold = Math.max(0.35, avgNoise * 5.0);

        let detekovanyCas = null;
        const windowSize = Math.floor(sampleRate * 0.02);

        for (let i = 0; i < maxScanSamples - windowSize; i += windowSize) {
          let peak = 0;
          for (let j = 0; j < windowSize; j++) {
            const val = Math.abs(channelData[i + j]);
            if (val > peak) peak = val;
          }

          if (peak > threshold) {
            detekovanyCas = i / sampleRate;
            break;
          }
        }

        if (detekovanyCas !== null) {
          startTime = detekovanyCas;
          video.currentTime = startTime;
          scrubber.value = startTime;
          updateHud();
          updateWaveformPlayhead();
        } else {
          alert("Výstřel nebyl spolehlivě nalezen. Nastavte čas ručně tlačítkem START.");
        }
      } catch (err) {
        console.error(err);
      } finally {
        btn.textContent = origText;
      }
    }

    async function exportovatVideo() {
      if (!video.src || !video.duration) {
        alert("Nejprve vyberte video.");
        return;
      }

      const selectedFps = parseInt(exportFpsSelect.value, 10) || 60;
      const targetBitrate = selectedFps === 60 ? 12000000 : 6000000;

      isExporting = true;
      video.pause();
      exportOverlay.style.display = 'flex';
      exportModalTitle.textContent = `Vypaluji ${selectedFps} FPS video...`;

      const isPortrait = video.videoHeight > video.videoWidth;
      let targetW = isPortrait ? 720 : 1280;
      let targetH = Math.round(targetW * (video.videoHeight / video.videoWidth));
      if (targetH % 2 !== 0) targetH += 1;
      if (targetW % 2 !== 0) targetW += 1;

      exportCanvas.width = targetW;
      exportCanvas.height = targetH;
      const ctx = exportCanvas.getContext('2d', { alpha: false });

      let finalniCasUtoku = (milestonesData.terc_l !== null && milestonesData.terc_p !== null) 
        ? Math.max(milestonesData.terc_l, milestonesData.terc_p) 
        : null;

      const exportStart = Math.max(0, startTime - 1.0);
      const exportEnd = finalniCasUtoku ? Math.min(video.duration, startTime + finalniCasUtoku + 2.0) : video.duration;
      const totalDuration = exportEnd - exportStart;

      video.currentTime = exportStart;
      await new Promise(r => {
        const onSeek = () => { video.removeEventListener('seeked', onSeek); r(); };
        video.addEventListener('seeked', onSeek);
      });

      const canvasStream = exportCanvas.captureStream(selectedFps);
      const audioCtx = await ensureAudioContextReady();
      initVideoAudioRouting();

      let combinedStream = canvasStream;
      let audioDest = null;

      if (videoMediaSourceNode) {
        try {
          audioDest = audioCtx.createMediaStreamDestination();
          videoMediaSourceNode.disconnect();
          videoMediaSourceNode.connect(audioDest);
          const tracks = [...canvasStream.getVideoTracks(), ...audioDest.stream.getAudioTracks()];
          combinedStream = new MediaStream(tracks);
        } catch (e) {}
      }

      let mimeType = 'video/webm;codecs=vp9,opus';
      let fileExt = 'webm';

      if (MediaRecorder.isTypeSupported('video/mp4;codecs=avc1,mp4a.40.2')) {
        mimeType = 'video/mp4;codecs=avc1,mp4a.40.2';
        fileExt = 'mp4';
      } else if (MediaRecorder.isTypeSupported('video/mp4')) {
        mimeType = 'video/mp4';
        fileExt = 'mp4';
      } else if (!MediaRecorder.isTypeSupported(mimeType)) {
        mimeType = 'video/webm;codecs=vp8,opus';
      }
      if (!MediaRecorder.isTypeSupported(mimeType)) {
        mimeType = 'video/webm';
      }

      const recorder = new MediaRecorder(combinedStream, {
        mimeType: mimeType,
        videoBitsPerSecond: targetBitrate
      });

      const chunks = [];
      recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };

      const exportFinished = new Promise(resolve => {
        recorder.onstop = async () => {
          let blob = new Blob(chunks, { type: mimeType });

          if (fileExt === 'webm' && typeof ysFixWebmDuration === 'function') {
            exportText.textContent = "Optimalizuji video...";
            try {
              blob = await ysFixWebmDuration(blob, totalDuration * 1000, { logger: false });
            } catch (err) {}
          }

          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `analyza_utoku_${selectedFps}fps_${formatTime(finalniCasUtoku || 0).replace(':', '_')}.${fileExt}`;
          a.click();
          URL.revokeObjectURL(url);

          if (videoMediaSourceNode && audioCtx) {
            try {
              videoMediaSourceNode.disconnect();
              videoMediaSourceNode.connect(audioCtx.destination);
            } catch (e) {}
          }

          exportOverlay.style.display = 'none';
          isExporting = false;
          resolve();
        };
      });

      recorder.start(250);
      await video.play();

      let lastCheckTime = -1;
      let stallCounter = 0;

      function renderExportLoop() {
        if (!isExporting) return;

        ctx.drawImage(video, 0, 0, exportCanvas.width, exportCanvas.height);
        drawHudOnCanvas(ctx, exportCanvas.width, exportCanvas.height);

        const progressPct = Math.min(100, Math.max(0, Math.round(((video.currentTime - exportStart) / totalDuration) * 100)));
        exportProgress.style.width = `${progressPct}%`;
        exportText.textContent = `Renderuji ${selectedFps} FPS: ${progressPct} %`;

        if (video.currentTime === lastCheckTime && !video.paused) {
          stallCounter++;
          if (stallCounter > 60) {
            video.currentTime += 0.05;
            stallCounter = 0;
          }
        } else {
          lastCheckTime = video.currentTime;
          stallCounter = 0;
        }

        if (video.currentTime >= exportEnd || video.ended) {
          video.pause();
          if (recorder.state !== 'inactive') {
            recorder.stop();
          }
        } else {
          requestAnimationFrame(renderExportLoop);
        }
      }

      requestAnimationFrame(renderExportLoop);
      await exportFinished;
    }

    function drawHudOnCanvas(ctx, w, h) {
      const baseDim = Math.min(w, h);
      const scale = baseDim / 720;
      const relTime = Math.max(0, video.currentTime - startTime);

      let finalniCasUtoku = (milestonesData.terc_l !== null && milestonesData.terc_p !== null) 
        ? Math.max(milestonesData.terc_l, milestonesData.terc_p) 
        : null;

      let displayTime = relTime;
      if (finalniCasUtoku !== null && relTime >= finalniCasUtoku) {
        displayTime = finalniCasUtoku;
      }

      const timerStr = formatTimerDisplay(displayTime);
      const isFinished = finalniCasUtoku !== null && relTime >= finalniCasUtoku;

      const padRight = 14 * scale;
      const padBottom = 16 * scale;

      ctx.font = `900 ${34.5 * scale}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
      const timerWidth = ctx.measureText(timerStr).width;

      let prostrikText = '';
      let prostrikWidth = 0;
      if (isFinished) {
        const diff = Math.abs(milestonesData.terc_l - milestonesData.terc_p);
        const pomalejsi = milestonesData.terc_l > milestonesData.terc_p ? 'Prostřik LP' : 'Prostřik PP';
        prostrikText = `${pomalejsi}: +${diff.toFixed(2)} s`;
        ctx.font = `700 ${12 * scale}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
        prostrikWidth = ctx.measureText(prostrikText).width;
      }

      const innerPaddingX = 16 * scale;
      const contentWidth = Math.max(timerWidth, prostrikWidth);
      const boxW = contentWidth + (innerPaddingX * 2);
      const boxH = isFinished ? (58 * scale) : (47 * scale);

      const boxX = w - padRight - boxW;
      const boxY = h - padBottom - boxH;

      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
      ctx.beginPath();
      ctx.roundRect(boxX, boxY, boxW, boxH, 8 * scale);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.20)';
      ctx.lineWidth = 1 * scale;
      ctx.stroke();

      const textRightEdge = boxX + boxW - innerPaddingX;

      ctx.fillStyle = '#ffffff';
      ctx.font = `900 ${34.5 * scale}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
      ctx.textAlign = 'right';
      ctx.textBaseline = isFinished ? 'top' : 'middle';
      const timerY = isFinished ? (boxY + (5 * scale)) : (boxY + (boxH / 2) + (1 * scale));
      ctx.fillText(timerStr, textRightEdge, timerY);

      if (isFinished) {
        ctx.fillStyle = '#fbbf24';
        ctx.font = `700 ${12 * scale}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
        ctx.textAlign = 'right';
        ctx.textBaseline = 'bottom';
        ctx.fillText(prostrikText, textRightEdge, boxY + boxH - (5 * scale));
      }

      const baseTargetX = w - padRight;
      let currentBaseY = boxY - (10 * scale);

      const animDuration = 0.35;
      const slideDistance = 60 * scale;

      const sortedMilestones = [...activeMilestonesConfig].sort((a, b) => {
        const valA = milestonesData[a.id] !== null ? milestonesData[a.id] : 999999;
        const valB = milestonesData[b.id] !== null ? milestonesData[b.id] : 999999;
        return valA - valB;
      });

      for (const item of sortedMilestones) {
        const val = milestonesData[item.id];

        if (val === null || relTime < val) {
          continue;
        }

        const timeSinceReached = relTime - val;
        let drawX = baseTargetX;
        let alpha = 1.0;

        if (timeSinceReached < animDuration) {
          const progress = timeSinceReached / animDuration;
          const ease = 1 - Math.pow(1 - progress, 3);
          drawX = baseTargetX + (slideDistance * (1 - ease));
          alpha = ease;
        }

        const valStr = formatTime(val);
        const labelStr = item.label.toUpperCase();

        ctx.font = `900 ${23.8 * scale}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
        const valWidth = ctx.measureText(valStr).width;

        ctx.font = `600 ${13 * scale}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
        const labelWidth = ctx.measureText(labelStr).width;

        const rowContentW = Math.max(valWidth, labelWidth);
        const padX = 8 * scale;
        const rowBgW = rowContentW + (padX * 2);
        const rowBgH = 43 * scale;
        const rowBgX = drawX - rowBgW;
        const rowBgY = currentBaseY - (39 * scale);

        ctx.fillStyle = `rgba(0, 0, 0, ${0.35 * alpha})`;
        ctx.beginPath();
        ctx.roundRect(rowBgX, rowBgY, rowBgW, rowBgH, 5 * scale);
        ctx.fill();

        ctx.strokeStyle = `rgba(255, 255, 255, ${0.10 * alpha})`;
        ctx.lineWidth = 1 * scale;
        ctx.stroke();

        ctx.shadowColor = `rgba(0, 0, 0, ${0.9 * alpha})`;
        ctx.shadowBlur = 4 * scale;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 2 * scale;

        ctx.fillStyle = `rgba(229, 231, 235, ${alpha})`;
        ctx.font = `600 ${13 * scale}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
        ctx.textAlign = 'right';
        ctx.textBaseline = 'top';
        ctx.fillText(labelStr, drawX - padX, rowBgY + (4 * scale));

        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.font = `900 ${23.8 * scale}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
        ctx.textBaseline = 'bottom';
        ctx.fillText(valStr, drawX - padX, rowBgY + rowBgH - (3 * scale));

        ctx.shadowColor = 'transparent';
        currentBaseY -= (47 * scale);
      }
    }
  </script>
</body>
